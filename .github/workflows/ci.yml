name: RoboMotion Stage 2 CI
on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No package-lock.json until an authenticated npm install succeeds.
      # Generate and commit package-lock.json from a successful trusted Mac npm install,
      # then switch this install step to npm ci for reproducible builds.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
