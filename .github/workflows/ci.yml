name: RoboMotion AI — Tests and Build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run automated regression
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build production
        run: npm run build
      - name: Release safety audit
        run: npm run audit:release
      - name: Measure build chunks
        run: npm run report:bundle
      - name: Archive build evidence
        uses: actions/upload-artifact@v4
        with:
          name: robomotion-build-evidence
          path: |
            reports/bundle-report.json
            dist/
          retention-days: 14
